# 로컬 실행: cp .env.example .env 후 `docker compose up -d --build` → http://localhost:8080
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: smartcollab
      MYSQL_USER: smartcollab
      MYSQL_PASSWORD: ${DB_PASSWORD:-smartcollab}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    build: .
    image: smartcollab:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/smartcollab?characterEncoding=UTF-8&serverTimezone=UTC
      DB_USERNAME: smartcollab
      DB_PASSWORD: ${DB_PASSWORD:-smartcollab}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 을 .env 에 32자 이상으로 설정하세요}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_ROOT: /data
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-}
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - files:/data

volumes:
  db-data:
  files:
