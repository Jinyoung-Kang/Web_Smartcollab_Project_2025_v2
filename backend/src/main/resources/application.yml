# 공통 설정. 환경별 값은 환경 변수로 주입합니다 (.env.example 참고).
spring:
  application:
    name: smartcollab
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartcollab?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:smartcollab}
    password: ${DB_PASSWORD:smartcollab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:210MB}
      file-size-threshold: 2MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/plain
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

app:
  jwt:
    # HS256 서명 키 — 32바이트(256bit) 이상. 운영에서는 반드시 환경 변수로 주입.
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:8h}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${STORAGE_LOCAL_ROOT:${user.home}/smartcollab-data}
    azure-connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    azure-container: ${AZURE_STORAGE_CONTAINER:smartcollab-files}
  files:
    text-edit-max-bytes: ${TEXT_EDIT_MAX_BYTES:2097152}
    trash-retention-days: ${TRASH_RETENTION_DAYS:30}
  rate-limit:
    login-per-minute: ${LOGIN_RATE_PER_MINUTE:10}
    share-password-per-10-minutes: ${SHARE_PASSWORD_RATE:10}
  deepl:
    api-key: ${DEEPL_API_KEY:}
    base-url: ${DEEPL_API_URL:https://api-free.deepl.com}
  demo:
    enabled: ${DEMO_ENABLED:false}
    password: ${DEMO_PASSWORD:}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
