# 공통 설정. 환경별 값은 환경 변수로 주입합니다 (.env.example 참고).
spring:
  application:
    name: smartcollab
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartcollab?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:smartcollab}
    password: ${DB_PASSWORD:smartcollab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:210MB}
      file-size-threshold: 2MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  # 프록시 헤더(X-Forwarded-For/Proto)는 Tomcat RemoteIpValve 가 처리합니다. 오른쪽(프록시가 덧붙인 값)부터 읽어
  # 신뢰할 프록시(기본: 사설·루프백 대역, SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES 로 변경)를 건너뛴 첫 주소를 클라이언트 IP 로 씁니다.
  # 'framework'(ForwardedHeaderFilter)는 클라이언트가 넣은 맨 앞 값을 믿어 요청 제한을 우회할 수 있었습니다 [SEC-01].
  forward-headers-strategy: native
  compression:
    enabled: true
    # Vite 산출물(.js)은 text/javascript 로 응답되므로 반드시 포함해야 압축됩니다.
    mime-types: application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,text/plain,image/svg+xml
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

app:
  jwt:
    # HS256 서명 키 — 32바이트(256bit) 이상. 운영에서는 반드시 환경 변수로 주입.
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:8h}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${STORAGE_LOCAL_ROOT:${user.home}/smartcollab-data}
    azure-connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    azure-container: ${AZURE_STORAGE_CONTAINER:smartcollab-files}
  files:
    text-edit-max-bytes: ${TEXT_EDIT_MAX_BYTES:2097152}
    trash-retention-days: ${TRASH_RETENTION_DAYS:30}
  rate-limit:
    login-per-minute: ${LOGIN_RATE_PER_MINUTE:10}
    # 여러 IP 에서 한 계정을 노리는 시도 제한. 로그인에 성공하면 초기화됩니다.
    login-per-account-per-10-minutes: ${LOGIN_ACCOUNT_RATE:20}
    share-password-per-10-minutes: ${SHARE_PASSWORD_RATE:10}
    # 여러 IP 에서 한 공유 링크의 비밀번호를 맞히려는 시도 제한
    share-password-per-link-per-10-minutes: ${SHARE_PASSWORD_LINK_RATE:50}
  deepl:
    api-key: ${DEEPL_API_KEY:}
    base-url: ${DEEPL_API_URL:https://api-free.deepl.com}
  demo:
    enabled: ${DEMO_ENABLED:false}
    password: ${DEMO_PASSWORD:}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
