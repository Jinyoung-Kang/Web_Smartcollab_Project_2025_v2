# 공통 설정. 환경별 값은 환경 변수로 주입합니다 (.env.example 참고).
spring:
  application:
    name: smartcollab
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartcollab?characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${DB_USERNAME:smartcollab}
    password: ${DB_PASSWORD:smartcollab}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:200MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:210MB}
      file-size-threshold: 2MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  shutdown: graceful
  # 프록시 헤더(X-Forwarded-For/Proto)는 Tomcat RemoteIpValve 가 처리합니다. 오른쪽(프록시가 덧붙인 값)부터 읽어
  # 신뢰할 프록시(기본: 사설·루프백 대역, SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES 로 변경)를 건너뛴 첫 주소를 클라이언트 IP 로 씁니다.
  # 'framework'(ForwardedHeaderFilter)는 클라이언트가 넣은 맨 앞 값을 믿어 요청 제한을 우회할 수 있었습니다 [SEC-01].
  forward-headers-strategy: native
  compression:
    enabled: true
    # Vite 산출물(.js)은 text/javascript 로 응답되므로 반드시 포함해야 압축됩니다.
    mime-types: application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,text/plain,image/svg+xml
  servlet:
    encoding:
      charset: UTF-8
      force: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**

app:
  jwt:
    # HS256 서명 키 — 32바이트(256bit) 이상. 운영에서는 반드시 환경 변수로 주입.
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:8h}
  cookie:
    secure: ${COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  storage:
    type: ${STORAGE_TYPE:local}
    local-root: ${STORAGE_LOCAL_ROOT:${user.home}/smartcollab-data}
    azure-connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
    azure-container: ${AZURE_STORAGE_CONTAINER:smartcollab-files}
  files:
    text-edit-max-bytes: ${TEXT_EDIT_MAX_BYTES:2097152}
    trash-retention-days: ${TRASH_RETENTION_DAYS:30}
    # 보관 기간이 지난 휴지통 파일을 비우는 시각. 서버(컨테이너) 시간대가 UTC 여도 이 시간대 기준으로 실행합니다.
    trash-purge-cron: ${TRASH_PURGE_CRON:0 0 4 * * *}
    trash-purge-zone: ${TRASH_PURGE_ZONE:Asia/Seoul}
  rate-limit:
    login-per-minute: ${LOGIN_RATE_PER_MINUTE:10}
    # 여러 IP 에서 한 계정을 노리는 시도 제한. 로그인에 성공하면 초기화됩니다.
    login-per-account-per-10-minutes: ${LOGIN_ACCOUNT_RATE:20}
    share-password-per-10-minutes: ${SHARE_PASSWORD_RATE:10}
    # 여러 IP 에서 한 공유 링크의 비밀번호를 맞히려는 시도 제한
    share-password-per-link-per-10-minutes: ${SHARE_PASSWORD_LINK_RATE:50}
    # 한 IP 에서 계정을 대량으로 만드는 것을 막음 [SEC-05]
    signup-per-hour: ${SIGNUP_RATE_PER_HOUR:5}
    # 한 사용자의 하루 번역 글자 수. DeepL 무료 요금제는 월 50만 자라 한 사람이 다 써 버리지 못하게 합니다 [SEC-07]
    translation-chars-per-user-per-day: ${TRANSLATION_CHARS_PER_USER_PER_DAY:100000}
  # 저장 공간 한도 — 옛 버전·휴지통까지 포함한 실제 저장량 기준 [SEC-05]
  quota:
    personal: ${QUOTA_PERSONAL:1GB}
    team: ${QUOTA_TEAM:5GB}
  deepl:
    api-key: ${DEEPL_API_KEY:}
    base-url: ${DEEPL_API_URL:https://api-free.deepl.com}
  demo:
    enabled: ${DEMO_ENABLED:false}
    password: ${DEMO_PASSWORD:}
    # 체험 계정의 개인 저장소와 체험 계정이 팀장인 팀의 저장 한도 [SEC-06]
    quota: ${DEMO_QUOTA:50MB}
    # 체험 데이터 초기화 시각 [SEC-06]
    reset-cron: ${DEMO_RESET_CRON:0 0 5 * * *}
    reset-zone: ${DEMO_RESET_ZONE:Asia/Seoul}
  http:
    # 파일 업로드를 뺀 요청 본문(JSON 등)의 최대 크기 [SEC-10]. 텍스트 편집 저장(TEXT_EDIT_MAX_BYTES, 2MB)이
    # JSON 으로 이스케이프되면 커질 수 있으므로 그 2배 이상으로 둡니다.
    max-body-size: ${MAX_REQUEST_BODY_SIZE:6MB}

logging:
  pattern:
    # 모든 로그 줄에 요청 추적 ID 를 붙입니다 [ARC-02] (요청 밖의 로그는 빈 괄호)
    correlation: "[%X{requestId:-}] "
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:warn}
