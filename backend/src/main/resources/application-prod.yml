# 운영(Azure App Service) 프로필 — SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

app:
  cookie:
    secure: true
  storage:
    type: azure

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
