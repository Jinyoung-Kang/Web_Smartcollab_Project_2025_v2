# 운영(Azure App Service) 프로필 — SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

app:
  cookie:
    secure: true
  cors:
    # 운영은 화면과 API 가 같은 출처라 CORS 가 필요 없습니다. 공통 설정의 localhost 개발 출처를 물려받지 않도록 비웁니다.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    type: azure

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
